name: Предложение
description: Предложить улучшение рабочего процесса
body:
  - type: textarea
    id: problem
    attributes:
      label: Задача пользователя
      description: Что нужно сделать и что сейчас мешает?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Ожидаемый результат
      description: Пример сценария и критерий, по которому понятно, что задача решена
    validations:
      required: true

      <use href="#tick" transform="rotate(105)"/><use href="#tick" transform="rotate(120)"/><use href="#tick" transform="rotate(135)"/>
      <use href="#tick" transform="rotate(150)"/><use href="#tick" transform="rotate(165)"/><use href="#tick" transform="rotate(180)"/>
      <use href="#tick" transform="rotate(210)"/><use href="#tick" transform="rotate(225)"/><use href="#tick" transform="rotate(240)"/>
      <use href="#tick" transform="rotate(255)"/><use href="#tick" transform="rotate(270)"/><use href="#tick" transform="rotate(285)"/>
    </g>
  </g>
  <circle r="45" cx="111" cy="89" fill="var(--paper)" stroke="var(--gold)" stroke-width="1.8"/>

    <path d="M83 34c-12 7-27 32-27 54 0 39 30 65 67 65l10-1" stroke-width="2"/>
    <path d="M59 109c6 17 16 28 29 35" stroke-width=".85"/>
  </g>
  <g fill="var(--shine)" stroke="var(--gold)" stroke-width="1.3">
    <circle cx="86" cy="31" r="3"/><circle cx="138" cy="151" r="3"/>
    <path d="m106 152 2 8 6 2 4-9Z"/>
  </g>

    <use href="#point" x="52" y="64"/><use href="#point" x="48" y="54"/><use href="#point" x="191" y="74"/>
    <use href="#point" x="205" y="83"/><use href="#point" x="220" y="63"/><use href="#point" x="182" y="134"/>
    <use href="#point" x="199" y="139"/><use href="#point" x="211" y="127"/>
  </g>

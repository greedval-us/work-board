<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <style>
    :root { --ink: #71473d; --gold: #966721; --shine: #c18c39; --paper: #f8edce; --edge: #b49c6c; --wine: #7c3e51 }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #c49b76; --gold: #dfb56c; --shine: #f6d994; --paper: #4b3631; --edge: #9d7857; --wine: #c08798 }
    }
  </style>
  <defs>
    <g id="spark" fill="var(--gold)"><path d="M0-8C.6-2.8 1.7-1.4 5.5 0 1.7 1.4.6 2.8 0 8-.6 2.8-1.7 1.4-5.5 0-1.7-1.4-.6-2.8 0-8Z"/></g>
    <g id="point"><circle r="2.5" fill="var(--paper)" stroke="var(--gold)" stroke-width="1.15"/><circle r=".8" fill="var(--shine)"/></g>
    <g id="tick" stroke="var(--gold)" stroke-width="1.3"><path d="M0-57v4"/></g>
    <clipPath id="globe"><circle r="45" cx="111" cy="89"/></clipPath>

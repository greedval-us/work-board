  <g fill="var(--shine)"><circle cx="64" cy="23" r="1.3"/><circle cx="23" cy="102" r="1.4"/>
    <circle cx="201" cy="95" r="1.3"/><circle cx="166" cy="126" r="1.6"/><circle cx="150" cy="13" r="1.1"/></g>

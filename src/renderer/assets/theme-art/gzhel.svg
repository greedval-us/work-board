    <use href="#blade" transform="translate(67 172) rotate(153) scale(.83)"/>
    <use href="#blade" transform="translate(78 159) rotate(-103) scale(.64)"/>
    <use href="#blade" transform="translate(53 121) rotate(-158) scale(.82)"/>
    <use href="#blade" transform="translate(41 115) rotate(-124) scale(.60)"/>
    <use href="#blade" transform="translate(131 144) rotate(67) scale(.94)"/>
    <use href="#blade" transform="translate(146 148) rotate(28) scale(1.02)"/>
    <use href="#blade" transform="translate(160 147) rotate(-22) scale(.79)"/>
    <use href="#blade" transform="translate(151 110) rotate(-8) scale(.79)"/>
    <use href="#blade" transform="translate(162 98) rotate(-67) scale(.67)"/>
    <use href="#blade" transform="translate(133 64) rotate(-84) scale(.70)"/>
    <use href="#blade" transform="translate(166 50) rotate(-51) scale(.8)"/>
    <use href="#blade" transform="translate(185 45) rotate(-3) scale(.67)"/>
  </g>
  <g transform="translate(168 70) rotate(34) scale(.49)">
    <path fill="url(#brush)" d="M0 17C-8 16-27 0-23-13-20-23-10-16-6-10-8-26 4-31 9-24 13-18 11-11 9-5 15-18 27-17 25-6 23 6 8 15 0 17Z"/>
    <path fill="var(--ink)" d="M-15 8Q-5 9 0 15L6 5 6 13 20 4Q13 19 0 22Z"/>
  </g>
  <use href="#rose" transform="translate(96 109) rotate(-16) scale(.98)"/>
  <use href="#rose" transform="translate(141 40) rotate(22) scale(.45)"/>
  <g fill="var(--ink)">
    <circle cx="18" cy="148" r="2.5"/><circle cx="15" cy="140" r="1.7"/><circle cx="15" cy="133" r="1.2"/>
    <circle cx="60" cy="60" r="2.5"/><circle cx="65" cy="65" r="1.7"/><circle cx="69" cy="71" r="1.2"/>
    <circle cx="218" cy="54" r="2.3"/><circle cx="224" cy="59" r="1.5"/><circle cx="228" cy="64" r="1"/>
    <circle cx="187" cy="104" r="2.1"/><circle cx="181" cy="107" r="1.4"/>

    <path stroke-width="2.3" d="M62 174C91 164 80 147 75 134M111 142C143 143 165 158 192 138 207 127 207 112 197 112 188 112 190 122 196 120"/>
    <path stroke-width="2" d="M82 135C66 118 50 122 36 108 18 87 31 61 49 64 59 66 60 78 52 80 46 81 42 74 46 71"/>
    <path stroke-width="1.6" d="M115 129C149 119 166 99 169 80M57 171C41 171 35 164 38 157 40 152 48 156 44 160M137 83C130 70 130 54 139 39"/>
  </g>
  <g>

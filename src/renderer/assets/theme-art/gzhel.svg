<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <style>
    :root { --deep: #153b82; --ink: #2559a6; --blue: #4e8bce; --wash: #bbd6f1; --glaze: #f4f9ff }
    @media (prefers-color-scheme: dark) {
      :root { --deep: #487bbf; --ink: #77a0da; --blue: #9ebfe8; --wash: #c9ddf5; --glaze: #eef7ff }
    }
  </style>
  <defs>
    <linearGradient id="brush" x1=".12" y1=".95" x2=".75" y2=".03" gradientUnits="objectBoundingBox">
      <stop stop-color="var(--deep)"/><stop offset=".32" stop-color="var(--ink)"/>
      <stop offset=".61" stop-color="var(--blue)"/><stop offset=".86" stop-color="var(--wash)"/>
      <stop offset="1" stop-color="var(--glaze)"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1=".85" x2=".7" y2=".08" gradientUnits="objectBoundingBox">
      <stop stop-color="var(--deep)"/><stop offset=".45" stop-color="var(--ink)"/><stop offset="1" stop-color="var(--wash)"/>
    </linearGradient>
    <g id="blade">
      <path fill="url(#leaf)" d="M0 0C5-10 20-17 37-11 25-9 17 6 0 0Z"/>
      <path fill="none" stroke="var(--glaze)" stroke-opacity=".8" stroke-width="1.1" d="M2 0Q17-7 29-10"/>
    </g>
    <g id="rose">
      <g fill="url(#brush)">
        <path d="M-13-3C-34-7-42-23-31-32-28-42-10-42-3-25-1-19-6-10-13-3Z"/>
        <path d="M-5-7C-15-23-13-41 0-45 9-48 15-43 18-39 31-40 34-23 17-12 10-10 4-9-5-7Z"/>
        <path d="M9-2C23-20 40-24 46-16 55-8 42 9 26 11 33 5 27-2 9-2Z"/>
        <path d="M-11 10C-33 14-49 5-49-6-53-17-36-25-23-14-18-10-17 0-11 10Z"/>
        <path d="M-6 10C-1 23-21 36-35 25-44 21-43 11-40 7-33 12-20 17-6 10Z"/>
        <path d="M9 5C27-1 42 2 42 13 47 26 24 37 12 26 7 21 6 11 9 5Z"/>
        <path d="M-5 7C6 12 15 23 10 33 8 43-10 43-18 30-23 22-17 17-5 7Z"/>
        <path d="M-17 1C-26-8-21-19-13-20-10-28 2-26 8-19 15-20 23-11 16-4 8 5-6 6-17 1Z"/>
        <path d="M-15 2C-4 8 7 5 15-1 18 9 8 19-4 17-11 16-16 10-15 2Z"/>
      </g>
      <g fill="none" stroke="var(--deep)" stroke-linecap="round">
        <path d="M-14-4Q-19-17-9-18M-4-19Q3-22 9-15M13-14Q19-10 16-6" stroke-width="1.6"/>
        <path d="M-11 2C-12-9 0-15 7-8 13-2 4 4-2 1-6-1-1-6 2-4" stroke-width="2.4"/>
        <path d="M-2 10Q11 12 15 4M-39 0Q-34 7-26 7M27 19Q34 17 35 13M-1 33Q7 35 8 27" stroke-width="1.4"/>
      </g>
      <g fill="var(--deep)"><circle cx="-5" cy="-11" r="1.3"/><circle cx="10" cy="-4" r="1.2"/><circle cx="-10" cy="-7" r="1"/></g>
    </g>
  </defs>
  <!-- Two vines sweep around the main rose, with the lighter edge of each brushstroke facing out. -->
  <g fill="none" stroke="var(--ink)" stroke-linecap="round">
